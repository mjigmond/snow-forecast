[project]
name = "snow-forecast"
version = "0.1.0"
description = "An API to provide snow forecast for desired (point or polygon) locations."
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "fastapi>=0.115.12",
    "geopandas>=1.0.1",
    "herbie-data>=2025.3.1",
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "ipython>=9.1.0",
    "python-dotenv>=1.1.0",
    "rioxarray>=0.18.2",
    "scipy>=1.15.2",
    "uvicorn>=0.34.1",
]
